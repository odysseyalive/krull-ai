services:
  ollama:
    image: ollama/ollama:latest
    container_name: krull-ollama
    restart: "no"
    tty: true
    volumes:
      - ./data/ollama:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      # Default context length for any request that doesn't specify num_ctx
      # (e.g. Open WebUI browser chats). Without this Ollama falls back to its
      # built-in 4096 default, which clips multi-turn + web-search context and
      # makes the model "forget" earlier turns. Pinned to the same OLLAMA_NUM_CTX
      # the proxy requests, so every session — browser or agent — gets the full
      # window rather than being clipped.
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_NUM_CTX:-131072}
      # Flash attention + quantized KV cache shrink KV-cache VRAM so a larger
      # context window fits on tight-VRAM cards. KV quantization requires flash
      # attention. Both are read by the Ollama daemon at startup.
      - OLLAMA_FLASH_ATTENTION=${OLLAMA_FLASH_ATTENTION:-1}
      - OLLAMA_KV_CACHE_TYPE=${OLLAMA_KV_CACHE_TYPE:-q8_0}
      # Concurrent request slots per model. VRAM scales as NUM_PARALLEL ×
      # context window, so this is the real control for running agents in
      # parallel. Default 1 (serialize) matches Ollama's own default.
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: krull-webui
    depends_on:
      - ollama
    restart: "no"
    ports:
      - "3000:8080"
    volumes:
      - ./data/webui:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://krull-ollama:11434
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-changeme-generate-a-real-key}
      - WEBUI_AUTH=False
      - ENABLE_API_KEYS=True
      # Web access for the chat model is provided by the intent-gated inlet
      # filter functions/web_search.py, which calls the krull-web-broker
      # (external-engine {query,count} -> [{link,title,snippet}] contract) at
      # http://krull-web-broker:8130/search. The broker routes intent to SearXNG
      # + host playwright-mcp and returns honest markers on failure.
      #
      # The old ENABLE_RAG_WEB_SEARCH / RAG_WEB_SEARCH_ENGINE / SEARXNG_QUERY_URL
      # / RAG_WEB_LOADER_ENGINE vars were removed: the pinned open-webui:main
      # image no longer reads those names (renamed to WEB_SEARCH_ENGINE /
      # WEB_LOADER_ENGINE / EXTERNAL_WEB_SEARCH_URL), so they were inert. To flip
      # to OWUI's NATIVE external engine later, set here instead:
      #   ENABLE_WEB_SEARCH=True
      #   WEB_SEARCH_ENGINE=external
      #   EXTERNAL_WEB_SEARCH_URL=http://krull-web-broker:8130/search
      #   WEB_LOADER_ENGINE=external
      #   EXTERNAL_WEB_LOADER_URL=http://krull-web-broker:8130/load
      # and retire the inlet filter (see DEC on the integration decision).

  searxng:
    image: searxng/searxng:latest
    container_name: krull-searxng
    restart: "no"
    volumes:
      - ./data/searxng/settings.yml:/etc/searxng/settings.yml:rw
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

  # playwright-mcp as an in-network container (built from the sibling
  # ../playwright-mcp repo, cloned by scripts/setup.sh). Runs the LOCAL trust
  # tier over its no-auth loopback Streamable-HTTP transport, reachable by the
  # broker as krull-playwright:8765 — CONTAINER-TO-CONTAINER, so no host INPUT
  # boundary is crossed and NO ufw rule is needed. Its port is never published to
  # a host interface. Headless: covers web search + image/video + full-page reads.
  #
  # HEADED CAPTCHA handoff is the one thing a headless container cannot do (no
  # display to pop a window on). It degrades to an honest "unavailable" marker.
  # To enable inline solving on a Wayland host, mount the compositor socket and
  # flip BROKER_SOLVE_ENABLED=true on the broker below:
  #     environment:
  #       - WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-wayland-1}
  #       - XDG_RUNTIME_DIR=/run/user/1000
  #     volumes:
  #       - ${XDG_RUNTIME_DIR}/${WAYLAND_DISPLAY}:/run/user/1000/${WAYLAND_DISPLAY}
  #     user: "1000:1000"
  # (Environment-dependent; verify a window opens. The alternative is a host-run
  #  instance via scripts/web-broker-host.sh + the ufw allowance it prints.)
  playwright:
    build:
      context: ../playwright-mcp
    container_name: krull-playwright
    restart: "no"
    environment:
      - PLAYWRIGHT_MCP_PUBLIC_URL=http://krull-playwright:8765
      - PLAYWRIGHT_MCP_ALLOW_NOAUTH=1
      - PLAYWRIGHT_MCP_PORT=8765
      - PLAYWRIGHT_MCP_BIND=0.0.0.0

  # Deterministic web-access broker for the Open WebUI → Ollama chat path.
  # Speaks the OWUI `external` search/loader HTTP contracts (functions/web_search.py
  # calls /search); routes intent to SearXNG (text/image/video) and to the
  # krull-playwright container for full-page reads (+ headed CAPTCHA handoff when
  # enabled). Distinct from the Claude Code / LiteLLM / sse-proxy path.
  web-broker:
    build: ./broker
    container_name: krull-web-broker
    depends_on:
      - searxng
      - playwright
    restart: "no"
    environment:
      - SEARXNG_URL=http://krull-searxng:8080
      - PLAYWRIGHT_MCP_URL=${PLAYWRIGHT_MCP_URL:-http://krull-playwright:8765/mcp}
      - BROKER_RESULT_COUNT=${BROKER_RESULT_COUNT:-5}
      # Headed CAPTCHA solving is off by default: the headless krull-playwright
      # container has no display. Enable together with the Wayland mount above.
      - BROKER_SOLVE_ENABLED=${BROKER_SOLVE_ENABLED:-false}
      - BROKER_SOLVE_TIMEOUT_MS=${BROKER_SOLVE_TIMEOUT_MS:-90000}
      - BROKER_EXHAUSTIVE_FETCH=${BROKER_EXHAUSTIVE_FETCH:-3}
      - BROKER_PORT=8130

  sse-proxy:
    build: ./proxy
    container_name: krull-sse-proxy
    depends_on:
      - ollama
      - searxng
      - photon
    restart: "no"
    ports:
      - "4001:8081"
    # Mount the user's home read-only at the same path so the proxy can
    # read .claude/skills directories from any project the user is in.
    # Absolute paths Claude Code reports (e.g. cwd) resolve identically
    # inside and outside the container — no path translation needed.
    #
    # Also bind-mount ./proxy onto /app so host edits to sse_patch.py
    # take effect inside the container without needing a full image
    # rebuild. The Dockerfile starts uvicorn with --reload so the
    # process auto-restarts when sse_patch.py changes.
    volumes:
      - ${HOME}:${HOME}:ro
      - ./proxy:/app
      - ./logs:/app/logs
    environment:
      - OLLAMA_URL=http://krull-ollama:11434
      - SEARXNG_URL=http://krull-searxng:8080
      - KIWIX_URL=http://krull-kiwix:8080
      - ENABLE_WEB_SEARCH=true
      - ENABLE_KIWIX=true
      - ENABLE_DATE=true
      - ENABLE_MAP_SEARCH=true
      - ENABLE_LANG_DOCS=true
      - KIWIX_HOST_URL=http://localhost:8090
      - PHOTON_URL=http://krull-photon:2322
      - TILESERVER_URL=http://localhost:8070
      - SEARCH_RESULTS=5
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-131072}
      - CONTEXT_COMPACT_LIMIT=${CONTEXT_COMPACT_LIMIT:-98304}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
      - KRULL_TOOL_CALL_HARD_CAP=${KRULL_TOOL_CALL_HARD_CAP:-20}
      - KRULL_HOST_HOME=${HOME}
      - PORT=8081

  litellm:
    image: docker.litellm.ai/berriai/litellm:main-stable
    container_name: krull-litellm
    depends_on:
      - sse-proxy
    restart: "no"
    ports:
      - "4000:4000"
    volumes:
      - ./litellm:/app/config
    command: ["--config", "/app/config/config.yaml", "--port", "4000"]
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-local-dev-key}
      # Open WebUI API key the model routes authenticate with. Referenced
      # by litellm/config.yaml as os.environ/KRULL_WEBUI_API_KEY. Provided
      # from .env (gitignored); setup.sh mints and stores it there.
      - KRULL_WEBUI_API_KEY=${KRULL_WEBUI_API_KEY:-}

  tileserver:
    image: ghcr.io/maplibre/martin:latest
    container_name: krull-tileserver
    restart: "no"
    volumes:
      - ./data/tiles:/data:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        has_tiles() { ls /data/*.pmtiles 1>/dev/null 2>&1 || ls /data/*.mbtiles 1>/dev/null 2>&1; }
        if has_tiles; then
          exec martin /data
        else
          echo "No tile files found in /data/. Waiting for .pmtiles or .mbtiles files..."
          while ! has_tiles; do sleep 30; done
          exec martin /data
        fi

  map-viewer:
    build: ./map-viewer
    container_name: krull-map-viewer
    depends_on:
      - tileserver
    restart: "no"
    ports:
      - "8070:80"

  photon:
    image: rtuszik/photon-docker:latest
    container_name: krull-photon
    restart: "no"
    ports:
      - "2322:2322"
    volumes:
      - ./data/photon:/photon/photon_data
    environment:
      - COUNTRY_CODE=${PHOTON_COUNTRY_CODE:-}

  kiwix-front:
    image: nginx:alpine
    container_name: krull-kiwix-front
    restart: "no"
    depends_on:
      - kiwix
    ports:
      - "8090:80"
    volumes:
      - ./kiwix-front/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./kiwix-front/favicon:/usr/share/nginx/favicon:ro
      # Directory mount (not single-file) so edits to dark.css / toggle.js
      # are picked up live without recreating the container. Single-file
      # bind mounts pin to the host inode, and atomic-replace editors
      # (most of them) orphan that inode on every save.
      - ./kiwix-front/krull:/usr/share/nginx/krull:ro

  krull-updater:
    build: ./krull-updater
    container_name: krull-updater
    restart: "no"
    volumes:
      # The repo, so we can git fetch + git merge into it
      - .:/workspace
      # Docker socket so we can rebuild + restart sibling containers
      - /var/run/docker.sock:/var/run/docker.sock

  krull-home:
    build: ./krull-home
    container_name: krull-home
    restart: "no"
    ports:
      - "8000:8000"
    volumes:
      # Mount the repo so we can read scripts/, .env, zim/, data/tiles/, etc.
      - .:/workspace
      # Docker socket so we can restart sibling containers (kiwix, tileserver) after install/delete
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PORT=8000
      - KRULL_REPO=/workspace

  kiwix:
    image: ghcr.io/kiwix/kiwix-serve:latest
    container_name: krull-kiwix
    restart: "no"
    # No external port — fronted by krull-kiwix-front on 8090, which proxies
    # everything through and overrides /skin/favicon/* with the Krull mark.
    expose:
      - "8080"
    volumes:
      - ./zim:/data:ro
    entrypoint: ["/bin/sh", "-c"]
    # --skipInvalid lets kiwix-serve start even if one of the .zim files
    # in /data/ is corrupt or truncated. Without it, a single bad file
    # (e.g. an interrupted download or an HTML 404 page saved with a
    # .zim extension) takes the whole service into a crash loop.
    command:
      - |
        if ls /data/*.zim 1>/dev/null 2>&1; then
          exec kiwix-serve --skipInvalid /data/*.zim --address=all --port=8080
        else
          echo "No ZIM files found in /data/. Waiting for files..."
          while ! ls /data/*.zim 1>/dev/null 2>&1; do sleep 30; done
          exec kiwix-serve --skipInvalid /data/*.zim --address=all --port=8080
        fi

