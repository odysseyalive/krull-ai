general_settings:
  allow_requests_on_db_unavailable: true

litellm_settings:
  drop_params: true

model_list:
  # Routes through SSE Proxy which:
  # 1. Applies inlet filters (date, web search, kiwix) to messages
  # 2. Translates Responses API → Chat Completions format
  # 3. Forwards to Ollama with tools preserved
  # Flow: Claude Code → LiteLLM → SSE Proxy (filters) → Ollama → GPU

  - model_name: claude-sonnet-4-6
    litellm_params:
      model: openai/gemma4:e2b
      api_base: http://krull-sse-proxy:8081
      api_key: "sk-50467ff8c19b4864add5436a0abe0239"

  - model_name: claude-sonnet-4-20250514
    litellm_params:
      model: openai/gemma4:e2b
      api_base: http://krull-sse-proxy:8081
      api_key: "sk-50467ff8c19b4864add5436a0abe0239"

  - model_name: claude-opus-4-6
    litellm_params:
      model: openai/gemma4:e2b
      api_base: http://krull-sse-proxy:8081
      api_key: "sk-50467ff8c19b4864add5436a0abe0239"

  - model_name: claude-opus-4-20250514
    litellm_params:
      model: openai/gemma4:e2b
      api_base: http://krull-sse-proxy:8081
      api_key: "sk-50467ff8c19b4864add5436a0abe0239"

  - model_name: claude-haiku-4-5-20251001
    litellm_params:
      model: openai/gemma4:e2b
      api_base: http://krull-sse-proxy:8081
      api_key: "sk-50467ff8c19b4864add5436a0abe0239"

  # Claude Code's background calls (session titles, summaries, WebFetch)
  # default to the bare alias claude-haiku-4-5 when ANTHROPIC_SMALL_FAST_MODEL
  # is unset — e.g. when claude is launched without the krull-claude shim.
  - model_name: claude-haiku-4-5
    litellm_params:
      model: openai/gemma4:e2b
      api_base: http://krull-sse-proxy:8081
      api_key: "sk-50467ff8c19b4864add5436a0abe0239"

  # Wildcard catch-all — any model ID not matched above (e.g. agent-pinned
  # IDs from claude-workforce: claude-opus-4-8, claude-opus-5, claude-fable-5,
  # or any hand-typed "Other") resolves to the single active Krull model.
  # LiteLLM matches explicit model_name entries first and falls through to
  # "*" only when none match, so the named routes above are unaffected. Same
  # proxy api_base as every other entry — not a bypass. start.sh's sed keeps
  # the `model:` target synced to the active OLLAMA_MODEL.
  - model_name: "*"
    litellm_params:
      model: openai/gemma4:e2b
      api_base: http://krull-sse-proxy:8081
      api_key: "sk-50467ff8c19b4864add5436a0abe0239"
